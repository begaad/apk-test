services:
  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./apk:/srv/apk:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    restart: unless-stopped
